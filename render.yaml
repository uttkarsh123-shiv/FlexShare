services:
  - type: web
    name: flexshare-api
    rootDir: backend
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: NODE_ENV=production node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: FRONTEND_URL
        value: https://flex-share.vercel.app
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: flexshare-api
          property: host
      - key: KEEP_ALIVE
        value: false  # set to true in dashboard + redeploy to keep server warm

  - type: web
    name: flexshare-worker
    rootDir: backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
